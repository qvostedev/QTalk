name: Linux DEB

on:
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing release to receive the DEB (leave empty for build only)
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: linux-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          packages=$(python3 -c 'import sys; sys.path.insert(0,"installer/linux"); from package_deb import NATIVE_DEPENDENCIES; print(" ".join(x.split()[0] for x in NATIVE_DEPENDENCIES))')
          sudo apt-get install -y $packages fakeroot binutils xvfb xauth xdotool
      - name: Test Debian metadata
        run: python3 -m unittest discover -s installer/linux -p 'test_*.py'
      - name: Build and test on Linux
        run: |
          chmod +x gradlew
          xvfb-run -a ./gradlew :shared:jvmTest :desktopApp:test :desktopApp:packageQTalkDeb --no-configuration-cache
      - name: Assemble the distributable DEB
        run: |
          version=$(sed -n 's/^qtalkVersion=//p' gradle.properties | tr -d '\r')
          mkdir -p build/linux-release
          cp desktopApp/build/compose/binaries/main/deb-release/* build/linux-release/
          dpkg-deb --info build/linux-release/QTalk_*.deb
      - name: Install and launch on clean distributions
        run: |
          for image in ubuntu:24.04 debian:13; do
            docker run --rm -e DEBIAN_FRONTEND=noninteractive \
              -v "$PWD/build/linux-release:/packages:ro" \
              -v "$PWD/installer/linux:/checks:ro" "$image" bash -euc '
                apt-get update
                apt-get install -y /packages/QTalk_*.deb xvfb xauth xdotool dbus-x11
                desktop-file-validate /usr/share/applications/qtalk.desktop
                test -x /usr/bin/qtalk
                test -f /opt/qtalk/lib/runtime/release
                dpkg-query -W qtalk
                xvfb-run -a dbus-run-session -- bash /checks/smoke-test.sh
              '
          done
      - name: Save package
        uses: actions/upload-artifact@v4
        with:
          name: QTalk-Linux
          path: build/linux-release/*
          if-no-files-found: error
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QTalk-Linux-tests
          path: |
            shared/build/test-results/jvmTest/
            desktopApp/build/test-results/test/
            desktopApp/build/compose/logs/
          if-no-files-found: ignore
      - name: Publish Linux installer
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.publish_tag }}
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          version=$(sed -n 's/^qtalkVersion=//p' gradle.properties | tr -d '\r')
          test "$tag" = "v$version"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git diff --exit-code "$tag" HEAD -- shared/src/commonMain shared/src/jvmMain desktopApp/src/main
          for attempt in $(seq 1 30); do
            if gh release view "$tag" > /dev/null 2>&1; then break; fi
            sleep 20
          done
          gh release view "$tag" > /dev/null
          gh release upload "$tag" "build/linux-release/QTalk_${version}-1_amd64.deb#QTalk Linux installer (.deb)" --clobber
