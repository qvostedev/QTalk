name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Windows installer
        shell: pwsh
        run: ./gradlew.bat :desktopApp:test :desktopApp:packageQTalkInstaller
      - name: Verify bundled Windows native libraries
        shell: pwsh
        run: ./gradlew.bat :desktopApp:verifyWindowsUberJar
      - uses: actions/upload-artifact@v4
        with:
          name: QTalk-Windows-installer
          path: desktopApp/build/compose/binaries/main/exe/QTalk-Setup-*.exe
          if-no-files-found: error
      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $installer = "desktopApp/build/compose/binaries/main/exe/QTalk-Setup-$version.exe"
          if (!(Test-Path $installer)) { throw "Missing installer: $installer" }
          gh release create $env:GITHUB_REF_NAME "$installer#QTalk Windows installer" --verify-tag --title "QTalk $version" --notes-file "docs/releases/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
